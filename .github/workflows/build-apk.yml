name: Build TVBox APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: '选择要构建的 flavor'
        required: false
        default: Java
        type: choice
        options:
          - Java
          - Java32
          - Java64
      build_type:
        description: 'Debug = 测试包；Release = 混淆包（云端自动签名，可直接安装）'
        required: false
        default: Debug
        type: choice
        options:
          - Debug
          - Release
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 安装 JDK 11 与 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 两个版本：17 供 sdkmanager 使用，11 供 Gradle 编译使用
          # 最后一个（11）会作为默认 JAVA_HOME，17 另存为 JAVA_HOME_17_X64
          java-version: |
            17
            11

      - name: 3. 定位 GitHub 服务器预装的 Android SDK
        run: |
          # GitHub 官方 ubuntu 镜像已预装 Android SDK，无需第三方 action
          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            export ANDROID_HOME="/usr/local/lib/android/sdk"
          fi
          echo "SDK 路径: $ANDROID_HOME"
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDKMGR" ]; then
            echo "SDKMGR=$SDKMGR" >> "$GITHUB_ENV"
            echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"
          fi
          echo "--- 已安装 platform ---"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          echo "--- 已安装 build-tools ---"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
          # Chaquopy(pyramid) 配置阶段会强制读取 local.properties，本地被 gitignore 忽略，这里自动生成
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "已生成 local.properties:"
          cat local.properties

      - name: 4. 检查并按需安装缺失的 SDK 组件
        run: |
          NEED=0
          [ -d "$ANDROID_HOME/platforms/android-33" ] || NEED=1
          [ -d "$ANDROID_HOME/build-tools/33.0.2" ] || NEED=1
          [ -d "$ANDROID_HOME/build-tools/30.0.3" ] || NEED=1
          if [ "$NEED" -eq 0 ]; then
            echo "所需 SDK 组件齐全，跳过安装"
            exit 0
          fi
          if [ -z "$SDKMGR" ] || [ ! -x "$SDKMGR" ]; then
            echo "::error::缺少 SDK 组件且找不到 sdkmanager，请检查 runner 镜像"
            exit 1
          fi
          # sdkmanager 要求 JDK 17+，临时切换到 17（仅本步骤生效）
          if [ -n "$JAVA_HOME_17_X64" ]; then
            export JAVA_HOME="$JAVA_HOME_17_X64"
            export PATH="$JAVA_HOME/bin:$PATH"
          fi
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-33" "build-tools;33.0.2" "build-tools;30.0.3"

      - name: 5. 修正 pyramid 模块里写死的 Windows Python 路径
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pyramid/build.gradle")
          s = p.read_text()
          s2 = s.replace(
              'buildPython("D:/Programs/Python/Python38/python.exe")',
              'buildPython("/usr/bin/python3")',
          )
          p.write_text(s2)
          print("已替换为 Linux Python 路径" if s2 != s else "未找到原路径，可能已经改过")
          PY

      - name: 6. 在云端为 Release 自动配置签名（使用你自己的 jks）
        if: inputs.build_type == 'Release'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          if "signingConfigs {" not in s:
              lines = [
                  "    signingConfigs {",
                  "        release {",
                  '            storeFile file("../.github/workflows/my-release.jks")',
                  '            storePassword "tvbox2026release"',
                  '            keyAlias "tvboxkey"',
                  '            keyPassword "tvbox2026release"',
                  "            v1SigningEnabled true",
                  "            v2SigningEnabled true",
                  "        }",
                  "    }",
                  "",
              ]
              signing = "\n".join(lines) + "\n"
              s = s.replace("android {\n", "android {\n" + signing, 1)
          s = s.replace(
              "        release {\n            minifyEnabled true",
              "        release {\n            signingConfig signingConfigs.release\n            minifyEnabled true",
              1,
          )
          p.write_text(s)
          print("已在云端注入 Release 签名配置")
          PY

      - name: 7. 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 8. 执行 Gradle 打包
        run: |
          chmod +x gradlew
          FLAVOR="${{ inputs.flavor }}"
          BUILD_TYPE="${{ inputs.build_type }}"
          [ -z "$FLAVOR" ] && FLAVOR="Java"
          [ -z "$BUILD_TYPE" ] && BUILD_TYPE="Debug"
          echo "本次执行任务: assemble${FLAVOR}${BUILD_TYPE}"
          ./gradlew "assemble${FLAVOR}${BUILD_TYPE}" --stacktrace --no-daemon

      - name: 9. 输出构建摘要
        if: always()
        run: |
          echo "## TVBox 构建结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -d app/build/outputs/apk ]; then
            find app/build/outputs/apk -name "*.apk" -print | while read -r f; do
              echo "- \`$f\` ($(du -h "$f" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
            done
            find app/build/outputs/apk -name "*.apk" -print
          else
            echo "未找到 APK 输出目录（说明前面的构建步骤未成功）。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 10. 上传 APK 到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
